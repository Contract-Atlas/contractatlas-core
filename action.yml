name: ContractAtlas deployment check
description: Compare live Soroban contract WASM hashes with a manifest of declared and audit-reviewed hashes.
inputs:
  manifest:
    description: Manifest path relative to the workspace.
    required: true
  rpc-url:
    description: HTTPS Stellar RPC URL for the manifest's network. Store credential-bearing URLs in a repository secret.
    required: true
  strict:
    description: Set to 'true' to also fail on incomplete evidence (same as the CLI's --strict). Overrides fail-on.
    default: 'false'
  fail-on:
    description: Comma list of statuses that fail the job (drift, incomplete, unavailable). Same default as the CLI.
    default: 'drift,unavailable'
  version:
    description: Exact version of @anas.abubakar/contractatlas-core to install from npm.
    default: '0.1.1'
outputs:
  report:
    description: Path of the JSON report written by the run.
    value: ${{ steps.check.outputs.report }}
  exit-code:
    description: Exit code of the checker (0 ok, 1 failing status, 2 invalid manifest or usage, 3 unexpected error).
    value: ${{ steps.check.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install the pinned package
      shell: bash
      env:
        CA_VERSION: ${{ inputs.version }}
      run: |
        if ! [[ "$CA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "version must be an exact x.y.z version" >&2
          exit 2
        fi
        mkdir -p "$RUNNER_TEMP/contractatlas"
        npm install --prefix "$RUNNER_TEMP/contractatlas" --no-audit --no-fund "@anas.abubakar/contractatlas-core@$CA_VERSION"
    - name: Check declared deployments
      id: check
      shell: bash
      env:
        CA_MANIFEST: ${{ inputs.manifest }}
        CA_RPC: ${{ inputs.rpc-url }}
        CA_STRICT: ${{ inputs.strict }}
        CA_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(check "$CA_MANIFEST" --rpc "$CA_RPC" --format markdown --out "$RUNNER_TEMP/contractatlas/report.json")
        if [ "$CA_STRICT" = "true" ]; then
          args+=(--strict)
        elif [ "$CA_STRICT" != "false" ]; then
          echo "strict must be true or false" >&2
          exit 2
        else
          args+=(--fail-on "$CA_FAIL_ON")
        fi
        set +e
        "$RUNNER_TEMP/contractatlas/node_modules/.bin/contractatlas" "${args[@]}" > "$RUNNER_TEMP/contractatlas/report.md"
        code=$?
        set -e
        cat "$RUNNER_TEMP/contractatlas/report.md"
        cat "$RUNNER_TEMP/contractatlas/report.md" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$RUNNER_TEMP/contractatlas/report.json" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
